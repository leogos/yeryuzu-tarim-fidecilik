<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ürünler | Yeryüzü Bitkileri Fidecilik | Dikili İzmir</title>
    <meta
      name="description"
      content="Yeryüzü Bitkileri Fidecilik'in Dikili, İzmir seralarında yetişen sebze ve aromatik fide çeşitlerini inceleyin."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body data-page="urunler">
    <main>
      <main>
        <section id="urunler-hero" class="section-soft page-hero py-5">
          <div class="container py-lg-5">
            <div class="row justify-content-center text-center">
              <div class="col-lg-8">
                <span class="badge rounded-pill text-bg-light mb-3"
                  >Yeryüzü Bitkileri Tarım Fidecilik</span
                >
                <h1 class="display-5 fw-bold mb-3">Ürünlerimiz</h1>
                <p class="lead text-muted mb-0">
                  Sebze ve aromatik fide çeşitlerimizi inceleyin. Sipariş için
                  WhatsApp veya telefon butonlarını kullanabilirsiniz.
                </p>
              </div>
            </div>
          </div>
        </section>

        <section id="urun-listesi" class="section-soft pb-5">
          <div class="container pb-lg-5">
            <div id="products-grid" class="row g-4"></div>
          </div>
        </section>
      </main>

      <div
        class="modal fade"
        id="productImageModal"
        tabindex="-1"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered modal-xl">
          <div class="modal-content rounded-4 overflow-hidden">
            <div class="modal-header">
              <h2 class="modal-title h5" id="productImageTitle"></h2>

              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Kapat"
              ></button>
            </div>

            <div class="modal-body p-0">
              <div class="product-image-zoom-area">
                <img id="productImagePreview" src="" alt="" />
              </div>

              <div class="product-zoom-controls">
                <button
                  type="button"
                  class="btn btn-sm btn-outline-secondary"
                  data-zoom-out
                >
                  -
                </button>

                <button
                  type="button"
                  class="btn btn-sm btn-outline-secondary"
                  data-zoom-reset
                >
                  Reset
                </button>

                <button
                  type="button"
                  class="btn btn-sm btn-outline-secondary"
                  data-zoom-in
                >
                  +
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/main.js"></script>
  </body>
</html>
